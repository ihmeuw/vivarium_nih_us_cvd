plugins:
    required:
        component_configuration_parser:
            controller: "vivarium_nih_us_cvd.plugins.CausesConfigurationParser"

components:
    external_configuration:
        vivarium_nih_us_cvd:
            - "components/causes/causes.yaml"

    vivarium_nih_us_cvd:
        components:
            - SimpleResultsStratifier()

            # Risk factor exposures
            - AdjustedRisk("risk_factor.high_ldl_cholesterol")
            - BinnedRiskObserver("risk_factor.high_ldl_cholesterol")
            - AdjustedRisk("risk_factor.high_systolic_blood_pressure")
            - BinnedRiskObserver("risk_factor.high_systolic_blood_pressure")
            - TruncatedRisk("risk_factor.high_body_mass_index_in_adults")
            - TruncatedRisk("risk_factor.high_fasting_plasma_glucose")
            - CategoricalSBPRisk()

            - RiskCorrelation()

            # Log-linear risk effects: BMI on IS/MI targets
            # NOTE: RR=1.0 stubs pending real data — see memory/project_bmi_is_mi_investigation.md
            - MediatedRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.acute_ischemic_stroke.incidence_rate")
            - MediatedRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - MediatedRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.acute_myocardial_infarction.incidence_rate")
            - MediatedRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")

            # Log-linear risk effects: BMI on heart failure (mediated by categorical SBP)
            - MediatedRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.heart_failure_from_ischemic_heart_disease.incidence_rate")
            - MediatedRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.heart_failure_residual.incidence_rate")

            # Log-linear risk effects: Categorical SBP on heart failure
            - MediatedRiskEffect("risk_factor.categorical_high_systolic_blood_pressure", "cause.heart_failure_from_ischemic_heart_disease.incidence_rate")
            - MediatedRiskEffect("risk_factor.categorical_high_systolic_blood_pressure", "cause.heart_failure_residual.incidence_rate")

            # Non-log-linear risk effects: SBP on IS/MI targets
            - NonLogLinearMediatedRiskEffect("risk_factor.high_systolic_blood_pressure", "cause.acute_ischemic_stroke.incidence_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_systolic_blood_pressure", "cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_systolic_blood_pressure", "cause.acute_myocardial_infarction.incidence_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_systolic_blood_pressure", "cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")

            # Non-log-linear risk effects: LDL-C on IS/MI targets
            - NonLogLinearMediatedRiskEffect("risk_factor.high_ldl_cholesterol", "cause.acute_ischemic_stroke.incidence_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_ldl_cholesterol", "cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_ldl_cholesterol", "cause.acute_myocardial_infarction.incidence_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_ldl_cholesterol", "cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")

            # Non-log-linear risk effects: FPG on IS/MI targets (mediated by LDL-C)
            - NonLogLinearMediatedRiskEffect("risk_factor.high_fasting_plasma_glucose", "cause.acute_ischemic_stroke.incidence_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_fasting_plasma_glucose", "cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_fasting_plasma_glucose", "cause.acute_myocardial_infarction.incidence_rate")
            - NonLogLinearMediatedRiskEffect("risk_factor.high_fasting_plasma_glucose", "cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")

            # Joint PAF: loads cached PAFs from artifact
            - JointPAF()

            # Healthcare utilization + treatment ramps
            - HealthcareUtilization()  # NOTE: this uses Treatment() as a sub-component

            # Intervention adherence machinery (no-op under baseline scenario)
            - InterventionAdherenceEffect()
            - LinearScaleUp("risk_factor.outreach")
            - LinearScaleUp("risk_factor.polypill")
            - LinearScaleUp("risk_factor.lifestyle")

            # Observers
            - HealthcareVisitObserver()
            - CategoricalColumnObserver("sbp_medication")
            - CategoricalColumnObserver("ldlc_medication")
            - CategoricalColumnObserver("outreach")
            - CategoricalColumnObserver("polypill")
            - LifestyleObserver()

    vivarium_public_health:
        population:
            - BasePopulation()
        results:
            - MortalityObserver()
            - DisabilityObserver()
            - DiseaseObserver("ischemic_stroke")
            - DiseaseObserver("ischemic_heart_disease_and_heart_failure")
        risks:
            - Risk("risk_factor.sbp_medication_adherence")
            - Risk("risk_factor.ldlc_medication_adherence")
            - Risk("risk_factor.outreach")
            - Risk("risk_factor.polypill")
            - Risk("risk_factor.lifestyle")

configuration:
    input_data:
        artifact_path: '../artifacts/united_states_of_america.hdf'
    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 0
    time:
        start:
            year: 2024
            month: 1
            day: 1
        end:
            year: 2040
            month: 12
            day: 31
        step_size: 28 # Days
    population:
        population_size: 10_000
        initialization_age_min: 5
        initialization_age_max: 125
        untracking_age: 125
    stratification:
        default:
            - 'age_group'
            - 'sex'
            - 'current_year'

    risk_factor.outreach:
        data_sources:
            exposure: 0
    risk_factor.polypill:
        data_sources:
            exposure: 0
    risk_factor.lifestyle:
        distribution_type: "dichotomous"
        data_sources:
            exposure: .0855
    outreach:
        exposure: 0
    polypill:
        exposure: 0
    lifestyle:
        exposure: .0855
    intervention:
        scenario: "baseline"
    outreach_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0
            end: 0
    polypill_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0
            end: 0
    lifestyle_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0.0855
            end: 0.0855
