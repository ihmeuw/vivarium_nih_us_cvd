## Phase 1: Disease models only.
##
## Smallest possible model spec that exercises the upgrade path:
##   - CausesConfigurationParser builds DiseaseModel/DiseaseState (vph 5 API)
##   - The draw-column-stripping monkey-patch in plugins/__init__.py
##   - All cause/sequela artifact data loading (US-level GBD 2023)
##   - Disease state transitions across simulation steps
##
## No risk factors, no risk effects, no observers beyond the basic mortality
## observer. If this yaml does not load and step, none of the later phases
## will work either, so it is the right starting point for the build-up.

plugins:
    required:
        component_configuration_parser:
            controller: "vivarium_nih_us_cvd.plugins.CausesConfigurationParser"

components:
    external_configuration:
        vivarium_nih_us_cvd:
            - "components/causes/causes.yaml"

    vivarium_public_health:
        population:
            - BasePopulation()
        results:
            - MortalityObserver()

configuration:
    input_data:
        artifact_path: '../artifacts/united_states_of_america.hdf'
    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 0
    time:
        start:
            year: 2024 # GBD 2023 artifact covers year bin 2023-2024
            month: 1
            day: 1
        end:
            year: 2025
            month: 12
            day: 31
        step_size: 28 # Days
    population:
        population_size: 1_000
        initialization_age_min: 5
        initialization_age_max: 125
        untracking_age: 125
