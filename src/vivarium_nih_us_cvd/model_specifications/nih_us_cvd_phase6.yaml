## Phase 6: Phase 5 + the three "easy" CVD-local observers
## (HealthcareVisitObserver, CategoricalColumnObserver, LifestyleObserver).
##
## Step 1 of the post-Phase-5 migration plan. These observers consume
## state-table columns that already exist in the Phase 4/5 stack
## (visit_type, sbp_medication, ldlc_medication, outreach, polypill,
## lifestyle), so wiring them in is a yaml-and-verify exercise with
## no new data or API work.
##
## What this exercises beyond Phase 5:
##   - HealthcareVisitObserver registers one adding-observation per
##     visit_type category (none/emergency/scheduled/missed/background).
##   - CategoricalColumnObserver registers one adding-observation per
##     category of sbp_medication, ldlc_medication, outreach, polypill.
##   - LifestyleObserver observes cat1 (enrolled) vs cat2 (not enrolled)
##     person-time using the special null/non-null split on the
##     `lifestyle` column.
##
## What is still NOT exercised:
##   - MediatedRiskEffect / NonLogLinearMediatedRiskEffect
##   - JointPAFObserver / paf_calculation_risk_effect
##   (these are Step 2 / Phase 7.)

plugins:
    required:
        component_configuration_parser:
            controller: "vivarium_nih_us_cvd.plugins.CausesConfigurationParser"

components:
    external_configuration:
        vivarium_nih_us_cvd:
            - "components/causes/causes.yaml"

    vivarium_nih_us_cvd:
        components:
            - SimpleResultsStratifier()

            # Risk factor exposures.
            - AdjustedRisk("risk_factor.high_ldl_cholesterol")
            - BinnedRiskObserver("risk_factor.high_ldl_cholesterol")
            - AdjustedRisk("risk_factor.high_systolic_blood_pressure")
            - BinnedRiskObserver("risk_factor.high_systolic_blood_pressure")
            - TruncatedRisk("risk_factor.high_body_mass_index_in_adults")
            - TruncatedRisk("risk_factor.high_fasting_plasma_glucose")
            - CategoricalSBPRisk()

            - RiskCorrelation()

            # Risk effects from Phase 3
            - RiskEffectWithoutPAF("risk_factor.high_body_mass_index_in_adults", "cause.heart_failure_from_ischemic_heart_disease.incidence_rate")
            - RiskEffectWithoutPAF("risk_factor.high_body_mass_index_in_adults", "cause.heart_failure_residual.incidence_rate")
            - NonLogLinearRiskEffectWithoutPAF("risk_factor.high_systolic_blood_pressure", "cause.acute_ischemic_stroke.incidence_rate")

            # Healthcare utilization + treatment ramps
            - HealthcareUtilization()  # NOTE: this uses Treatment() as a sub-component

            # Intervention adherence machinery (no-op under baseline scenario)
            - InterventionAdherenceEffect()
            - LinearScaleUp("risk_factor.outreach")
            - LinearScaleUp("risk_factor.polypill")
            - LinearScaleUp("risk_factor.lifestyle")

            # Phase 6: the three "easy" observers.
            - HealthcareVisitObserver()
            - CategoricalColumnObserver("sbp_medication")
            - CategoricalColumnObserver("ldlc_medication")
            - CategoricalColumnObserver("outreach")
            - CategoricalColumnObserver("polypill")
            - LifestyleObserver()

    vivarium_public_health:
        population:
            - BasePopulation()
        results:
            - MortalityObserver()
            - DisabilityObserver()
            - DiseaseObserver("ischemic_stroke")
            - DiseaseObserver("ischemic_heart_disease_and_heart_failure")
        risks:
            - Risk("risk_factor.sbp_medication_adherence")
            - Risk("risk_factor.ldlc_medication_adherence")
            - Risk("risk_factor.outreach")
            - Risk("risk_factor.polypill")
            - Risk("risk_factor.lifestyle")

configuration:
    input_data:
        artifact_path: '../artifacts/united_states_of_america.hdf'
    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 0
    time:
        start:
            year: 2024 # GBD 2023 artifact covers year bin 2023-2024
            month: 1
            day: 1
        end:
            year: 2025
            month: 12
            day: 31
        step_size: 28 # Days
    population:
        population_size: 1_000
        initialization_age_min: 5
        initialization_age_max: 125
        untracking_age: 125
    stratification:
        default:
            - 'age_group'
            - 'sex'
            - 'current_year'

    risk_factor.outreach:
        data_sources:
            exposure: 0
    risk_factor.polypill:
        data_sources:
            exposure: 0
    risk_factor.lifestyle:
        distribution_type: "dichotomous"
        data_sources:
            exposure: .0855
    outreach:
        exposure: 0
    polypill:
        exposure: 0
    lifestyle:
        exposure: .0855
    intervention:
        scenario: "baseline"
    outreach_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0
            end: 0
    polypill_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0
            end: 0
    lifestyle_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0.0855
            end: 0.0855
