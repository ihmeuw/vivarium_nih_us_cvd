## PAF Calculation Model Specification
##
## Runs a single time step with a large population to compute joint
## mediated population-attributable fractions for each target rate.
## The JointPAFObserver computes PAF = (E[RR] - 1) / E[RR] within
## each age/sex stratum.
##
## Output is saved as a results CSV that can be post-processed into
## the artifact key ``risk_factor.joint_mediated_risks.population_attributable_fraction``.

plugins:
    required:
        component_configuration_parser:
            controller: "vivarium_nih_us_cvd.plugins.CausesConfigurationParser"

components:
    external_configuration:
        vivarium_nih_us_cvd:
            - "components/causes/causes.yaml"

    vivarium_nih_us_cvd:
        components:
            - SimpleResultsStratifier()

            # Risk factor exposures (all TruncatedRisk for PAF calc —
            # no medication adjustment, we want GBD untreated exposure).
            - TruncatedRisk("risk_factor.high_systolic_blood_pressure")
            - TruncatedRisk("risk_factor.high_body_mass_index_in_adults")
            - TruncatedRisk("risk_factor.high_ldl_cholesterol")
            - TruncatedRisk("risk_factor.high_fasting_plasma_glucose")
            - CategoricalSBPRisk()

            - RiskCorrelation()

            # Log-linear PAF effects (BMI on IS/MI + HF, categorical SBP on HF)
            # STUB: BMI→IS/MI uses RR=1.0 pending real data
            - PAFCalculationRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.acute_ischemic_stroke.incidence_rate")
            - PAFCalculationRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - PAFCalculationRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.acute_myocardial_infarction.incidence_rate")
            - PAFCalculationRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")
            - PAFCalculationRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.heart_failure_from_ischemic_heart_disease.incidence_rate")
            - PAFCalculationRiskEffect("risk_factor.high_body_mass_index_in_adults", "cause.heart_failure_residual.incidence_rate")
            - PAFCalculationRiskEffect("risk_factor.categorical_high_systolic_blood_pressure", "cause.heart_failure_from_ischemic_heart_disease.incidence_rate")
            - PAFCalculationRiskEffect("risk_factor.categorical_high_systolic_blood_pressure", "cause.heart_failure_residual.incidence_rate")

            # Non-log-linear PAF effects (SBP, LDL-C, FPG)
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_systolic_blood_pressure", "cause.acute_ischemic_stroke.incidence_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_systolic_blood_pressure", "cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_systolic_blood_pressure", "cause.acute_myocardial_infarction.incidence_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_systolic_blood_pressure", "cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")

            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_ldl_cholesterol", "cause.acute_ischemic_stroke.incidence_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_ldl_cholesterol", "cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_ldl_cholesterol", "cause.acute_myocardial_infarction.incidence_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_ldl_cholesterol", "cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")

            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_fasting_plasma_glucose", "cause.acute_ischemic_stroke.incidence_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_fasting_plasma_glucose", "cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_fasting_plasma_glucose", "cause.acute_myocardial_infarction.incidence_rate")
            - NonLogLinearPAFCalculationRiskEffect("risk_factor.high_fasting_plasma_glucose", "cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")

            # Joint PAF observers (one per target rate)
            - JointPAFObserver("cause.acute_ischemic_stroke.incidence_rate")
            - JointPAFObserver("cause.chronic_ischemic_stroke_to_acute_ischemic_stroke.transition_rate")
            - JointPAFObserver("cause.acute_myocardial_infarction.incidence_rate")
            - JointPAFObserver("cause.post_myocardial_infarction_to_acute_myocardial_infarction.transition_rate")
            - JointPAFObserver("cause.heart_failure_from_ischemic_heart_disease.incidence_rate")
            - JointPAFObserver("cause.heart_failure_residual.incidence_rate")

    vivarium_public_health:
        population:
            - BasePopulation()

configuration:
    input_data:
        artifact_path: '../artifacts/united_states_of_america.hdf'
    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 0
    time:
        start:
            year: 2024
            month: 1
            day: 1
        end:
            year: 2024
            month: 1
            day: 29
        step_size: 28 # Days — only one step needed
    population:
        population_size: 100_000
        initialization_age_min: 5
        initialization_age_max: 100
        untracking_age: 100
    stratification:
        default: ['sex', 'age_group']
