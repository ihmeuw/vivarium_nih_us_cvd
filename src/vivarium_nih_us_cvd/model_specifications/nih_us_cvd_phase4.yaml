## Phase 4: Disease models + risks + risk effects + healthcare/treatment/interventions.
##
## Builds on Phase 3 by attaching the full healthcare-utilization,
## medication-treatment, and intervention pipeline:
##
##   - Custom risks: AdjustedRisk for SBP / LDL-C (uses
##     `<risk>.gbd_exposure` -> medication multiplier ->
##     `<risk>.exposure`), TruncatedRisk for BMI / FPG, and
##     CategoricalSBPRisk binning of the SBP exposure.
##   - RiskCorrelation supplies correlated propensity columns for the
##     four custom risks (replacing the propensity initializers that
##     vph 5's stock `Risk` would otherwise create).
##   - HealthcareUtilization (with Treatment as a sub-component) drives
##     emergency / scheduled / background visits, FPG testing, lifestyle
##     enrollment, and SBP / LDL-C medication ramps.
##   - The vph 5 `Risk` components for sbp_medication_adherence,
##     ldlc_medication_adherence, outreach, polypill, and lifestyle
##     produce the per-simulant exposures the Treatment component
##     consumes.
##   - InterventionAdherenceEffect, plus three LinearScaleUp wrappers
##     for outreach / polypill / lifestyle, exercise the intervention
##     value-modifier machinery (everything is set to baseline / 0%
##     coverage in this phase so the modifiers run but are no-ops).
##
## What this exercises beyond Phase 3:
##   - vivarium 4 `register_attribute_modifier` /
##     `register_value_modifier` API for the SBP / LDL-C medication
##     effect on `<risk>.exposure`, the lifestyle drop-value modifiers,
##     and the polypill SBP-adherence modifier.
##   - vivarium 4 `register_rate_producer` for the background
##     utilization rate.
##   - The `register_initializer(initializer=..., columns=...,
##     required_resources=[...])` flow used by Treatment +
##     HealthcareUtilization (instead of the legacy
##     `initialization_requirements` dict).
##   - LDL-C medication effect handling for the new GBD 2023 wide-form
##     `medication_effect` table (Treatment falls back to hardcoded
##     LDLC_MEDICATION_EFFICACY constants when the long-form
##     ldlc_medication column is missing).
##   - Loading of the `medication_coverage.scaling_factor` lookup table.
##
## What is NOT exercised yet:
##   - MediatedRiskEffect / JointPAF (left out because the GBD 2023 USA
##     artifact does not contain
##     risk_factor.joint_mediated_risks.population_attributable_fraction;
##     Phase 3 already covers the log-linear and non-log-linear risk
##     effect machinery via RiskEffectWithoutPAF and
##     NonLogLinearRiskEffectWithoutPAF).
##   - Disability / disease observers and the categorical column
##     observers — those land in Phase 5.

plugins:
    required:
        component_configuration_parser:
            controller: "vivarium_nih_us_cvd.plugins.CausesConfigurationParser"

components:
    external_configuration:
        vivarium_nih_us_cvd:
            - "components/causes/causes.yaml"

    vivarium_nih_us_cvd:
        components:
            - SimpleResultsStratifier()

            # Risk factor exposures (custom subclasses that depend on
            # propensity columns supplied by RiskCorrelation and on
            # multiplier columns supplied by Treatment).
            - AdjustedRisk("risk_factor.high_ldl_cholesterol")
            - AdjustedRisk("risk_factor.high_systolic_blood_pressure")
            - TruncatedRisk("risk_factor.high_body_mass_index_in_adults")
            - TruncatedRisk("risk_factor.high_fasting_plasma_glucose")
            - CategoricalSBPRisk()

            - RiskCorrelation()

            # Risk effects from Phase 3
            - RiskEffectWithoutPAF("risk_factor.high_body_mass_index_in_adults", "cause.heart_failure_from_ischemic_heart_disease.incidence_rate")
            - RiskEffectWithoutPAF("risk_factor.high_body_mass_index_in_adults", "cause.heart_failure_residual.incidence_rate")
            - NonLogLinearRiskEffectWithoutPAF("risk_factor.high_systolic_blood_pressure", "cause.acute_ischemic_stroke.incidence_rate")

            # Healthcare utilization + treatment ramps
            - HealthcareUtilization()  # NOTE: this uses Treatment() as a sub-component

            # Intervention adherence machinery (no-op under baseline scenario)
            - InterventionAdherenceEffect()
            - LinearScaleUp("risk_factor.outreach")
            - LinearScaleUp("risk_factor.polypill")
            - LinearScaleUp("risk_factor.lifestyle")

    vivarium_public_health:
        population:
            - BasePopulation()
        results:
            - MortalityObserver()
        risks:
            # Medication adherence and intervention coverage exposures
            # consumed by Treatment / InterventionAdherenceEffect.
            - Risk("risk_factor.sbp_medication_adherence")
            - Risk("risk_factor.ldlc_medication_adherence")
            - Risk("risk_factor.outreach")
            - Risk("risk_factor.polypill")
            - Risk("risk_factor.lifestyle")

configuration:
    input_data:
        artifact_path: '../artifacts/united_states_of_america.hdf'
    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 0
    time:
        start:
            year: 2024 # GBD 2023 artifact covers year bin 2023-2024
            month: 1
            day: 1
        end:
            year: 2025
            month: 12
            day: 31
        step_size: 28 # Days
    population:
        population_size: 1_000
        initialization_age_min: 5
        initialization_age_max: 125
        untracking_age: 125
    stratification:
        default:
            - 'age_group'
            - 'sex'
            - 'current_year'

    # Intervention exposures: baseline scenario starts everyone at 0%
    # outreach / polypill coverage, and uses the same lifestyle baseline
    # as the production yaml.
    risk_factor.outreach:
        data_sources:
            exposure: 0
    risk_factor.polypill:
        data_sources:
            exposure: 0
    risk_factor.lifestyle:
        distribution_type: "dichotomous"
        data_sources:
            exposure: .0855
    outreach:
        exposure: 0
    polypill:
        exposure: 0
    lifestyle:
        exposure: .0855
    intervention:
        scenario: "baseline"
    outreach_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0
            end: 0
    polypill_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0
            end: 0
    lifestyle_scale_up:
        date:
            start:
                year: 2023
                month: 1
                day: 1
            end:
                year: 2024
                month: 1
                day: 1
        value:
            start: 0.0855
            end: 0.0855
